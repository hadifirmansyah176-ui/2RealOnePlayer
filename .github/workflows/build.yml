      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        working-directory: RealOnePlayer
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RealOnePlayer-debug-apk
          path: RealOnePlayer/app/build/outputs/apk/debug/*.apk
